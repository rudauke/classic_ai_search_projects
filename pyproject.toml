[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "classic-ai-search"
version = "0.1.0"
description = "Classic AI search algorithms: Knight's Tour, Sliding Puzzle, Tic-Tac-Toe"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]